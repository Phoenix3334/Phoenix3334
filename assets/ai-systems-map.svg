<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Feihong Guo - AI Systems from Training to Serving</title>
<desc id="diagram-desc">Conceptual map of data, model training with CPT SFT and RL, models, inference runtime with online serving and RL rollout generation, evaluation, and the distributed hardware foundation. Rollouts feed RL training; evaluation informs iterations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#101B2B"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#90A5C1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="feedback-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60D6BF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
  text{font-family:Inter,'Segoe UI',Arial,sans-serif}
  .kicker{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#6DDCC6}
  .heading{font-size:25px;font-weight:700;fill:#F4F8FF}
  .subhead{font-size:13px;fill:#A8B9D1}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.2px}
  .card-title{font-size:17px;font-weight:700;fill:#ECF3FF}
  .body{font-size:13px;fill:#B4C2D5}
  .note{font-size:11px;fill:#829CB6}
  .flow{fill:none;stroke:#90A5C1;stroke-width:2;marker-end:url(#arrow)}
  .feedback{fill:none;stroke:#60D6BF;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#feedback-arrow)}
 </style>
</defs>
