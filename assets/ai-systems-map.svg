<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">A View of AI Systems - Feihong Guo</title>
<desc id="desc">A minimal light-theme systems map, inspired by the author's presentation style. It connects model training, architecture, inference runtime, AI infrastructure and hardware, and end-to-end evaluation. DSpark draft training feeds speculative decoding, while RL inference rollouts feed RL training.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
    <path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#537E87" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .head{font-size:30px;font-weight:700;fill:#24313D}
    .sub{font-size:14px;fill:#697984}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;fill:#357B78}
    .section{font-size:21px;font-weight:650;fill:#273846}
    .detail{font-size:15px;fill:#5B6B76}
    .small{font-size:13px;fill:#607782}
    .strong{font-size:17px;font-weight:650;fill:#273846}
  </style>
</defs>
<rect width="1200" height="510" fill="#F9F8F5"/>
<!-- Header mirrors the ivory / blue-gray presentation style -->
<rect x="64" y="40" width="3" height="43" rx="1.5" fill="#43898B"/>
<text x="82" y="52" class="eyebrow">AI SYSTEMS  /  PERSONAL VIEW</text>
<text x="82" y="88" class="head">From Model Training to Reliable Serving</text>
<text x="82" y="113" class="sub">Connecting data, models, systems and hardware through end-to-end evaluation</text>
<line x1="64" y1="132" x2="1136" y2="132" stroke="#D8DFDF" stroke-width="1.4"/>
<!-- Three spacious columns -->
<text x="76" y="176" class="section">Data &amp; Training</text>
<rect x="76" y="187" width="46" height="3" rx="1.5" fill="#43898B"/>
<text x="76" y="222" class="detail">Pretraining / CPT</text>
<text x="76" y="254" class="detail">Post-training / SFT · RL</text>
<text x="76" y="286" class="detail">Draft training / DSpark</text>

<text x="448" y="176" class="section">Models &amp; Algorithms</text>
<rect x="448" y="187" width="46" height="3" rx="1.5" fill="#43898B"/>
<text x="448" y="222" class="detail">Model architecture</text>
<text x="448" y="254" class="detail">Attention · MoE</text>
<text x="448" y="286" class="detail">Target &amp; draft models</text>

<text x="820" y="176" class="section">Inference &amp; Runtime</text>
<rect x="820" y="187" width="46" height="3" rx="1.5" fill="#43898B"/>
<text x="820" y="222" class="detail">Online &amp; multimodal serving</text>
<text x="820" y="254" class="detail">Speculative decoding</text>
<text x="820" y="286" class="detail">RL rollout generation</text>

<!-- Minimal left-to-right model-to-serving transitions -->
<path d="M367 236 H421" stroke="#537E87" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<path d="M739 236 H793" stroke="#537E87" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<!-- Training / inference connections -->
<line x1="76" y1="314" x2="1124" y2="314" stroke="#D8DFDF" stroke-width="1"/>
<text x="76" y="342" font-size="14" font-weight="600" fill="#357B78">Draft training</text>
<text x="186" y="342" font-size="14" fill="#7C8D98">→</text>
<text x="214" y="342" class="small">speculative decoding</text>
<circle cx="594" cy="338" r="2.5" fill="#C4CFD2"/>
<text x="635" y="342" font-size="14" font-weight="600" fill="#357B78">RL rollouts</text>
<text x="727" y="342" font-size="14" fill="#7C8D98">→</text>
<text x="752" y="342" class="small">RL training feedback</text>
<!-- Hardware foundation -->
<line x1="76" y1="369" x2="1124" y2="369" stroke="#D8DFDF" stroke-width="1"/>
<text x="76" y="406" class="strong">AI Infrastructure &amp; Hardware</text>
<text x="468" y="406" class="detail">Distributed systems · GPU/NPU · Memory · Interconnect</text>
<!-- Bottom-level evaluation: purpose of the full stack -->
<rect x="76" y="433" width="1048" height="55" rx="5" fill="#FFFFFF" stroke="#CDD9D8" stroke-width="1.4"/>
<rect x="76" y="433" width="5" height="55" rx="2.5" fill="#43898B"/>
<text x="100" y="466" class="strong">End-to-End Evaluation</text>
<text x="443" y="466" font-size="15" fill="#50636D">Quality  ·  Performance / SLO  ·  Reliability  ·  Cost / TCO</text>
</svg>