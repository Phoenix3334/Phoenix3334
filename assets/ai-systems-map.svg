<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Feihong Guo - My View of AI Systems</title>
<desc id="desc">An end-to-end map linking data, pretraining and post-training including CPT and SFT and RL, models, inference runtime, evaluation, and a distributed hardware foundation. Draft training supplies speculative decoding; inference rollouts feed RL training; system evaluation informs the training process.</desc>
