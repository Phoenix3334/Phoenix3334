<circle cx="354" cy="425" r="2.5" fill="#8BA0A5"/>
<text x="378" y="430" font-size="13" fill="#596F7B">GPU / NPU compute</text>
<circle cx="628" cy="425" r="2.5" fill="#8BA0A5"/>
