<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Feihong Guo - AI Systems from Training to Serving</title>
<desc id="diagram-desc">Conceptual map of data, pretraining and post-training, speculative draft training, models, inference runtime with online serving, speculative decoding and RL rollout generation, evaluation, and shared AI infrastructure. Drafts are used by speculative decoding; rollouts feed RL training; evaluation informs iterations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFAF7"/><stop offset="1" stop-color="#F3F6F5"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#81959C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="feedback-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4A8C8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="draft-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6F8D99" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
  text{font-family:Inter,'Segoe UI',Arial,sans-serif}
  .kicker{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#4A8C8A}
  .heading{font-size:25px;font-weight:700;fill:#24333E}
  .subhead{font-size:13px;fill:#687985}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.2px}
  .card-title{font-size:17px;font-weight:700;fill:#273842}
  .body{font-size:13px;fill:#566B75}
  .note{font-size:11px;fill:#788A94}
  .flow{fill:none;stroke:#81959C;stroke-width:2;marker-end:url(#arrow)}
  .feedback{fill:none;stroke:#4A8C8A;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#feedback-arrow)}
 </style>
</defs>
<rect width="1200" height="500" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="498" rx="17" fill="none" stroke="#D6DFDF"/>
<rect x="38" y="40" width="4" height="34" rx="2" fill="#4A8C8A"/>
<text x="56" y="54" class="kicker">AI SYSTEMS · END-TO-END VIEW</text>
<text x="56" y="82" class="heading">From Model Development to Reliable Serving</text>
